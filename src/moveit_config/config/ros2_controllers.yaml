# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: position_controllers/GripperActionController


    # arm_with_gripper_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
gripper_controller:
  ros__parameters:
    joint: finger_joint
    # From UR3_ROS2_PICK_AND_PLACE: with stall detection on, a stalled close goal holds
    # the *measured* position, which drops the squeeze force and lets the cube slip.
    # Accept the close goal within goal_tolerance instead (contact stops the finger
    # short of the target) while the controller keeps driving toward it.
    allow_stalling: false
    stall_timeout: 0.5
    stall_velocity_threshold: 0.001
    goal_tolerance: 0.5
